name: Build

# Every push / pull request: build, test and package Jit natively on Windows, Linux and macOS and keep the
# packages as workflow artifacts. Tags v* (e.g. v1.2.0): also publish them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.1-SNAPSHOT"
          fi
          # jpackage wants a purely numeric version (1.2.3)
          numeric="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "Building $version (package version $numeric)"

      - name: Build, test and package
        shell: bash
        run: >
          mvn -B -ntp -Pnative verify
          -Drevision=${{ steps.version.outputs.version }}
          -Dnative.version=${{ steps.version.outputs.numeric }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/native/output/Jit -DestinationPath "dist/Jit-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/Jit-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz" -C target/native/output Jit

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/native/output/Jit.app "dist/Jit-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"

      # The MSI needs the WiX Toolset 3.x that comes with the windows-2022 runner image. Best effort: a missing
      # installer does not block the release of the portable zip.
      - name: Windows installer (releases only)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: |
          mvn -B -ntp "-Pnative,windows-installer" verify -DskipTests `
            "-Drevision=${{ steps.version.outputs.version }}" `
            "-Dnative.version=${{ steps.version.outputs.numeric }}"
          Get-ChildItem target/native/output/*.msi | ForEach-Object {
            Copy-Item $_ "dist/Jit-${{ steps.version.outputs.version }}-${{ matrix.name }}.msi"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jit-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: jit-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
